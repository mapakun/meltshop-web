<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Melt puddle -->
  <path d="M 5 43
           Q -3 51 4 58
           Q 11 64 25 60
           Q 32 66 40 61
           Q 49 65 57 59
           Q 64 54 63 47
           Q 62 42 57 41
           L 7 41 Z"
       fill="#EDD060" stroke="#3D2B0F" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Body -->
  <rect x="9" y="6" width="46" height="38" rx="13"
        fill="#F2DC6A" stroke="#3D2B0F" stroke-width="2.2"/>

  <!-- Gloss -->
  <ellipse cx="19" cy="15" rx="9" ry="5" fill="white" opacity="0.45" transform="rotate(-16 19 15)"/>

  <!-- Eyes -->
  <circle cx="23" cy="26" r="3.8" fill="#3D2B0F"/>
  <circle cx="41" cy="26" r="3.8" fill="#3D2B0F"/>
  <circle cx="24.6" cy="24.4" r="1.4" fill="white"/>
  <circle cx="42.6" cy="24.4" r="1.4" fill="white"/>

  <!-- Smile -->
  <path d="M 25 33 Q 32 40 39 33" stroke="#3D2B0F" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="15" cy="30" rx="5.5" ry="3.8" fill="#F5A8A8" opacity="0.65"/>
  <ellipse cx="49" cy="30" rx="5.5" ry="3.8" fill="#F5A8A8" opacity="0.65"/>

  <!-- 4-point sparkle (yellow) -->
  <path d="M 54 5 L 55.4 10.5 L 54 16 L 52.6 10.5 Z" fill="#F0D058"/>
  <path d="M 48.5 10.5 L 54 11.9 L 59.5 10.5 L 54 9.1 Z" fill="#F0D058"/>
  <!-- Small pink sparkle -->
  <path d="M 61 4 L 61.9 7 L 61 10 L 60.1 7 Z" fill="#F5A8C8"/>
  <path d="M 58 7 L 61 7.9 L 64 7 L 61 6.1 Z" fill="#F5A8C8"/>
</svg>
