name: Deploy to Lightsail VM

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행 (브랜치 선택 가능)

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}   # 실행 시 선택한 브랜치
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_BRANCH                  # 서버로 브랜치명 전달
          script: |
            set -e
            mkdir -p ~/meltshop
            cd ~/meltshop

            # 최신 코드 받기 (없으면 clone)
            if [ ! -d repo ]; then
              git clone https://github.com/mapakun/meltshop-web.git repo
            fi
            cd repo

            # 선택한 브랜치로 동기화
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            # 빌드
            docker build -t meltshop-web:latest .

            # 기존 컨테이너 정리 후 재실행
            docker stop meltshop-web || true
            docker rm meltshop-web || true
            docker run -d --name meltshop-web \
              --env-file ~/meltshop/.env \
              --restart unless-stopped \
              -p 80:3000 \
              meltshop-web:latest

            # 오래된 이미지 정리 (디스크 절약)
            docker image prune -f

            # 배포 확인
            sleep 5
            docker ps --filter "name=meltshop-web"
            echo "배포된 브랜치: $DEPLOY_BRANCH"