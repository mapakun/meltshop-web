name: Deploy to Lightsail VM

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/meltshop

            # 최신 코드 받기 (없으면 clone)
            if [ ! -d repo ]; then
              git clone https://github.com/사용자명/meltshop-web.git repo
            fi
            cd repo
            git fetch origin master
            git reset --hard origin/master

            # 빌드 & 실행 (.env는 상위 폴더의 것 사용)
            docker build -t meltshop-web:latest .
            docker stop meltshop-web || true
            docker rm meltshop-web || true
            docker run -d --name meltshop-web \
              --env-file ~/meltshop/.env \
              --restart unless-stopped \
              -p 3000:3000 \
              meltshop-web:latest
