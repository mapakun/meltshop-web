name: Deploy to Lightsail VM

on:
  push:
    branches: [master]
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼 추가

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/meltshop
            cd ~/meltshop

            # 최신 코드 받기 (없으면 clone)
            if [ ! -d repo ]; then
              git clone https://github.com/사용자명/meltshop-web.git repo
            fi
            cd repo
            git fetch origin master
            git reset --hard origin/master

            # 빌드
            docker build -t meltshop-web:latest .

            # 기존 컨테이너 정리 후 재실행
            docker stop meltshop-web || true
            docker rm meltshop-web || true
            docker run -d --name meltshop-web \
              --env-file ~/meltshop/.env \
              --restart unless-stopped \
              -p 3000:3000 \
              meltshop-web:latest

            # 오래된 이미지 정리 (디스크 절약)
            docker image prune -f

            # 배포 확인
            sleep 5
            docker ps --filter "name=meltshop-web"